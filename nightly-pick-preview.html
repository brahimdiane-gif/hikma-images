<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="One hand-picked film to watch tonight. A new pick every night.">
  <meta property="og:title" content="Nightly Pick — one film for tonight">
  <meta property="og:description" content="One hand-picked film to watch tonight. A new pick every night.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f0c24a'/%3E%3Ccircle cx='22' cy='13' r='12' fill='%23141428'/%3E%3C/svg%3E">
  <title>Nightly Pick — one film for tonight</title>
  <style>
:root {
  color-scheme: dark;
  --bg: oklch(16% 0.03 270);
  --surface: oklch(22% 0.04 270);
  --border: oklch(34% 0.05 270);
  --text: oklch(95% 0.01 270);
  --muted: oklch(75% 0.03 270);
  --accent: oklch(80% 0.14 85);
  --accent-text: oklch(20% 0.05 85);
  accent-color: var(--accent);
  scrollbar-color: oklch(60% 0.05 270) var(--bg);
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  min-block-size: 100dvb;
  background: radial-gradient(120% 60% at 50% 0, oklch(26% 0.08 280), var(--bg) 70%) var(--bg);
  color: var(--text);
  font: 1rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

.visually-hidden {
  position: absolute; inline-size: 1px; block-size: 1px; overflow: clip;
  clip-path: inset(50%); white-space: nowrap;
}

.site-header, main, .site-footer {
  inline-size: min(100% - 2rem, 70rem);
  margin-inline: auto;
}

.site-header {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
  gap: .5rem; padding-block: 1.25rem;
}
.brand { display: inline-flex; align-items: center; gap: .6rem; color: var(--text); font-weight: 700; text-decoration: none; letter-spacing: .02em; }
.moon { inline-size: 1.4rem; block-size: 1.4rem; border-radius: 50%; background: var(--accent); box-shadow: inset -.45rem -.1rem 0 0 var(--bg); }
.date { margin: 0; color: var(--muted); }

.hero { container-type: inline-size; padding-block: clamp(1.5rem, 6vw, 4rem); }
.eyebrow { margin: 0; color: var(--accent); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: .8rem; }
h1 { margin: .25rem 0 .75rem; font-size: clamp(2.2rem, 7vw, 4.5rem); line-height: 1.05; text-wrap: balance; }
h1 span { color: var(--muted); }
.lede { max-inline-size: 38rem; color: var(--muted); text-wrap: pretty; }

.moods { display: flex; flex-wrap: wrap; gap: .5rem; border: 0; padding: 0; margin: 1.5rem 0; }
.chip {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 999px;
  padding: .5rem 1rem; min-block-size: 2.75rem; cursor: pointer;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.pick {
  display: grid;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 1.25rem;
  overflow: clip;
}
.pick > * { min-inline-size: 0; }
.poster {
  --h: 260;
  aspect-ratio: 3 / 2;
  display: grid; place-content: center;
  background: linear-gradient(135deg, oklch(45% 0.15 var(--h)), oklch(25% 0.08 calc(var(--h) + 60)));
}
.poster::after { content: attr(data-initial); font-size: 5rem; font-weight: 800; color: oklch(95% 0.02 var(--h) / .85); }
.pick-body { padding: 1.5rem; }
.meta { margin: 0; color: var(--muted); font-size: .9rem; }
.pick h2 { margin: .25rem 0 .5rem; font-size: clamp(1.6rem, 4vw, 2.4rem); text-wrap: balance; }
.pick-body p#pick-why { color: var(--muted); max-inline-size: 36rem; }
.actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-block-start: 1.25rem; }

@container (inline-size > 40rem) {
  .pick { grid-template-columns: minmax(12rem, 1fr) 2fr; }
  .poster { aspect-ratio: auto; }
}

.btn {
  font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
  display: inline-flex; align-items: center; min-block-size: 2.75rem; padding-inline: 1.25rem;
  border-radius: .75rem; border: 1px solid var(--accent);
  background: var(--accent); color: var(--accent-text);
}
.btn.ghost { background: transparent; color: var(--text); border-color: var(--border); }
.btn:hover { filter: brightness(1.1); }
.btn.ghost:hover { border-color: var(--accent); filter: none; }

.archive { padding-block: 1rem 3rem; }
.archive h2 { font-size: 1.4rem; }
.grid { list-style: none; margin: 0; padding: 0; display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); }
.card { --h: 260; padding: 1rem; border-radius: 1rem; border: 1px solid var(--border); background: linear-gradient(160deg, oklch(30% 0.09 var(--h)), var(--surface)); }
.card time { color: var(--accent); font-size: .85rem; font-weight: 600; }
.card h3 { margin: .25rem 0; font-size: 1.1rem; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); font-size: .9rem; }

.site-footer { padding-block: 2rem; color: var(--muted); border-block-start: 1px solid var(--border); }

@media (prefers-reduced-motion: no-preference) {
  .chip, .btn { transition: background-color .15s, border-color .15s, filter .15s; }
}

.status { min-block-size: 1.5rem; margin: .5rem 0 0; color: var(--accent); font-size: .9rem; }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
.watchlist { padding-block: 1rem 0; }
.watchlist h2 { font-size: 1.4rem; }
.card button { font: inherit; margin-block-start: .5rem; padding: .25rem .75rem; min-block-size: 2.75rem; border-radius: .5rem; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; }
.card button:hover { border-color: var(--accent); color: var(--text); }

</style>
    </head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="Nightly Pick, home">
      <span class="moon" aria-hidden="true"></span>
      Nightly Pick
    </a>
    <p class="date"><time id="today"></time></p>
  </header>

  <main>
    <section class="hero" aria-labelledby="tonight-heading">
      <p class="eyebrow">Tonight's pick</p>
      <h1 id="tonight-heading">One film. <span>No scrolling.</span></h1>
      <p class="lede">Every night we choose a single film worth your evening. Tell us your mood and we'll narrow it down.</p>

      <fieldset class="moods">
        <legend class="visually-hidden">Choose a mood</legend>
        <button type="button" class="chip" data-mood="all" aria-pressed="true">Surprise me</button>
        <button type="button" class="chip" data-mood="cozy" aria-pressed="false">Cozy</button>
        <button type="button" class="chip" data-mood="thrilling" aria-pressed="false">Thrilling</button>
        <button type="button" class="chip" data-mood="mind-bending" aria-pressed="false">Mind-bending</button>
        <button type="button" class="chip" data-mood="funny" aria-pressed="false">Funny</button>
      </fieldset>

      <article class="pick" id="pick" aria-live="polite" aria-atomic="true">
        <div class="poster" id="poster" aria-hidden="true"></div>
        <div class="pick-body">
          <p class="meta"><span id="pick-year"></span> · <span id="pick-genre"></span> · <span id="pick-runtime"></span></p>
          <h2 id="pick-title"></h2>
          <p id="pick-why"></p>
          <p class="actions">
            <button type="button" id="another" class="btn">Another pick</button>
            <a id="pick-link" class="btn ghost" target="_blank" rel="noopener noreferrer">Find where to watch</a>
            <button type="button" id="save" class="btn ghost" aria-pressed="false">Save to watchlist</button>
            <button type="button" id="share" class="btn ghost">Share</button>
          </p>
          <p id="status" class="status" role="status"></p>
        </div>
      </article>
    </section>

    <section class="watchlist" id="watchlist-section" aria-labelledby="watchlist-heading" hidden>
      <h2 id="watchlist-heading">Your watchlist</h2>
      <ul class="grid" id="watchlist"></ul>
    </section>

    <section class="archive" aria-labelledby="archive-heading">
      <h2 id="archive-heading">Recent picks</h2>
      <ul class="grid" id="archive"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>Nightly Pick — a new film every night.</p>
  </footer>
<script>
// Curated list. Add entries here; the site picks one per day.
window.PICKS = [
  { title: "Paddington 2", year: 2017, genre: "Family comedy", runtime: "1h 43m", mood: ["cozy", "funny"], why: "Impossibly kind, beautifully designed, and funnier than it has any right to be." },
  { title: "Heat", year: 1995, genre: "Crime thriller", runtime: "2h 50m", mood: ["thrilling"], why: "A cat-and-mouse epic with the best downtown shootout ever filmed." },
  { title: "Inception", year: 2010, genre: "Sci-fi thriller", runtime: "2h 28m", mood: ["mind-bending", "thrilling"], why: "A heist inside dreams, with a spinning top you will argue about for days." },
  { title: "The Grand Budapest Hotel", year: 2014, genre: "Comedy", runtime: "1h 39m", mood: ["funny", "cozy"], why: "A dollhouse of a movie: precise, warm, and endlessly quotable." },
  { title: "Arrival", year: 2016, genre: "Sci-fi drama", runtime: "1h 56m", mood: ["mind-bending"], why: "First contact told as a quiet, devastating story about language and time." },
  { title: "Knives Out", year: 2019, genre: "Mystery comedy", runtime: "2h 10m", mood: ["funny", "thrilling"], why: "A modern whodunit that is both a puzzle box and a crowd-pleaser." },
  { title: "Spirited Away", year: 2001, genre: "Animated fantasy", runtime: "2h 5m", mood: ["cozy", "mind-bending"], why: "A bathhouse for spirits, a brave girl, and imagery you won't forget." },
  { title: "Mad Max: Fury Road", year: 2015, genre: "Action", runtime: "2h", mood: ["thrilling"], why: "One long chase, almost entirely practical, and relentlessly alive." },
  { title: "Everything Everywhere All at Once", year: 2022, genre: "Sci-fi comedy", runtime: "2h 19m", mood: ["mind-bending", "funny"], why: "Multiverse chaos wrapped around a very human story about family." },
  { title: "Amélie", year: 2001, genre: "Romantic comedy", runtime: "2h 2m", mood: ["cozy"], why: "A whimsical Paris, small kindnesses, and a love of tiny details." },
  { title: "Parasite", year: 2019, genre: "Thriller", runtime: "2h 12m", mood: ["thrilling", "mind-bending"], why: "A razor-sharp class satire that keeps changing shape." },
  { title: "The Princess Bride", year: 1987, genre: "Adventure comedy", runtime: "1h 38m", mood: ["cozy", "funny"], why: "Swordfights, true love, and the most comfortable rewatch there is." },
  { title: "The Shawshank Redemption", year: 1994, genre: "Drama", runtime: "2h 22m", mood: ["cozy"], why: "Patient, moving, and one of the most hopeful stories ever put on screen." },
  { title: "Whiplash", year: 2014, genre: "Music drama", runtime: "1h 47m", mood: ["thrilling"], why: "A drum lesson that plays like a thriller, with a finale that leaves you breathless." },
  { title: "Interstellar", year: 2014, genre: "Sci-fi", runtime: "2h 49m", mood: ["mind-bending"], why: "Space, time and a father's promise, scored by an organ you'll feel in your chest." },
  { title: "Superbad", year: 2007, genre: "Comedy", runtime: "1h 53m", mood: ["funny"], why: "A raunchy but surprisingly sweet last-night-of-high-school comedy." },
  { title: "Coco", year: 2017, genre: "Animated family", runtime: "1h 45m", mood: ["cozy"], why: "A colorful, music-filled story about family, memory and remembering." },
  { title: "Shutter Island", year: 2010, genre: "Psychological thriller", runtime: "2h 18m", mood: ["thrilling", "mind-bending"], why: "A storm, an asylum, and a mystery that keeps rewriting itself." },
  { title: "Groundhog Day", year: 1993, genre: "Comedy", runtime: "1h 41m", mood: ["funny", "cozy"], why: "The same day, again and again, and a quietly profound lesson in being better." },
  { title: "Memento", year: 2000, genre: "Mystery thriller", runtime: "1h 53m", mood: ["mind-bending", "thrilling"], why: "A story told backwards, so you share the hero's confusion." },
  { title: "Soul", year: 2020, genre: "Animated drama", runtime: "1h 40m", mood: ["cozy", "mind-bending"], why: "Jazz, afterlives, and a gentle reminder to notice small joys." },
  { title: "Hot Fuzz", year: 2007, genre: "Action comedy", runtime: "2h 1m", mood: ["funny", "thrilling"], why: "A sharp, fast, joke-per-second parody that also works as a real action film." }
];

(() => {
  const picks = window.PICKS || [];
  const $ = (id) => document.getElementById(id);
  let mood = "all";
  let offset = 0;
  let current = null;

  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  let saved = store.get("np-saved", []);
  const say = (msg) => { $("status").textContent = msg; };

  const dayNumber = (d = new Date()) =>
    Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);

  const pool = () => (mood === "all" ? picks : picks.filter((p) => p.mood.includes(mood)));

  const hue = (title) => [...title].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);

  const watchUrl = (p) =>
    "https://www.justwatch.com/us/search?q=" + encodeURIComponent(p.title);

  function render(p) {
    current = p;
    say("");
    $("save").setAttribute("aria-pressed", String(saved.includes(p.title)));
    $("save").textContent = saved.includes(p.title) ? "Saved \u2713" : "Save to watchlist";
    $("pick-title").textContent = p.title;
    $("pick-year").textContent = p.year;
    $("pick-genre").textContent = p.genre;
    $("pick-runtime").textContent = p.runtime;
    $("pick-why").textContent = p.why;
    $("pick-link").href = watchUrl(p);
    $("poster").style.setProperty("--h", hue(p.title));
    $("poster").dataset.initial = p.title.charAt(0);
  }

  function show() {
    const list = pool();
    if (!list.length) return;
    render(list[(dayNumber() + offset) % list.length]);
  }

  function renderArchive() {
    const today = dayNumber();
    const ul = $("archive");
    ul.textContent = "";
    for (let i = 1; i <= 6; i++) {
      const p = picks[(today - i + picks.length * 10) % picks.length];
      const when = new Date((today - i) * 86400000);
      const li = document.createElement("li");
      li.className = "card";
      li.style.setProperty("--h", hue(p.title));
      const t = document.createElement("time");
      t.dateTime = when.toISOString().slice(0, 10);
      t.textContent = when.toLocaleDateString("en", { month: "short", day: "numeric", timeZone: "UTC" });
      const h = document.createElement("h3");
      h.textContent = p.title;
      const m = document.createElement("p");
      m.textContent = `${p.year} · ${p.genre}`;
      li.append(t, h, m);
      ul.append(li);
    }
  }

  function renderWatchlist() {
    const ul = $("watchlist");
    ul.textContent = "";
    $("watchlist-section").hidden = saved.length === 0;
    for (const title of saved) {
      const p = picks.find((x) => x.title === title);
      if (!p) continue;
      const li = document.createElement("li");
      li.className = "card";
      li.style.setProperty("--h", hue(p.title));
      const h = document.createElement("h3");
      h.textContent = p.title;
      const m = document.createElement("p");
      m.textContent = `${p.year} \u00b7 ${p.genre}`;
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = "Remove";
      b.setAttribute("aria-label", `Remove ${p.title} from watchlist`);
      b.addEventListener("click", () => toggleSave(p.title));
      li.append(h, m, b);
      ul.append(li);
    }
  }

  function toggleSave(title) {
    saved = saved.includes(title) ? saved.filter((t) => t !== title) : [...saved, title];
    store.set("np-saved", saved);
    renderWatchlist();
    if (current) render(current);
  }

  $("today").textContent = new Date().toLocaleDateString("en", {
    weekday: "long", month: "long", day: "numeric",
  });
  $("today").dateTime = new Date().toISOString().slice(0, 10);

  mood = store.get("np-mood", "all");
  document.querySelectorAll(".chip").forEach((c) =>
    c.setAttribute("aria-pressed", String(c.dataset.mood === mood)));

  document.querySelectorAll(".chip").forEach((chip) =>
    chip.addEventListener("click", () => {
      mood = chip.dataset.mood;
      store.set("np-mood", mood);
      offset = 0;
      document.querySelectorAll(".chip").forEach((c) =>
        c.setAttribute("aria-pressed", String(c === chip)));
      show();
    }));

  $("another").addEventListener("click", () => { offset += 1; show(); });

  $("save").addEventListener("click", () => current && toggleSave(current.title));

  $("share").addEventListener("click", async () => {
    if (!current) return;
    const text = `Tonight's pick: ${current.title} (${current.year}) \u2014 ${current.why}`;
    try {
      if (navigator.share) await navigator.share({ title: "Nightly Pick", text, url: location.href });
      else { await navigator.clipboard.writeText(`${text} ${location.href}`); say("Copied to clipboard."); }
    } catch (e) { if (e.name !== "AbortError") say("Couldn't share on this browser."); }
  });

  show();
  renderArchive();
  renderWatchlist();
})();

</script>
</body>
</html>
